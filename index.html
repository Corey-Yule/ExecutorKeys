<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Access Keys</title>
</head>
<body>
  <h1>Here are your keys:</h1>
  <pre id="key">Loading...</pre>

  <script>
    fetch('https://raw.githubusercontent.com/Corey-Yule/ExecutorKeys/PortFolio/keys')
      .then(response => response.text())
      .then(data => {
        const keys = data.trim().split('\n');  // Split keys by new line

        // Shuffle the keys to randomize order
        for (let i = keys.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [keys[i], keys[j]] = [keys[j], keys[i]]; // Swap
        }

        // Choose the first 3 random keys (you can change this number)
        const selectedKeys = keys.slice(0, 3);
        document.getElementById('key').textContent = selectedKeys.join('\n');
      })
      .catch(err => {
        document.getElementById('key').textContent = 'Error fetching keys.';
        console.error(err);
      });
  </script>
</body>
</html>
